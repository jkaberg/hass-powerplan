# Home Assistant integration quality scale (PLAN §7 dec. 9, D8 §5.12).
#
# Target: Silver at v1.0, with the Gold rules the design already satisfies.
# Rule names and the file schema are hassfest's (script/hassfest/quality_scale.py); hassfest does not validate this file for a custom integration,
# so it is a tracker for the maintainer, kept in the shape hassfest would accept.
#
# Everything is `todo` at WP0.1 except the rules that cannot apply to a site
# that has nothing to discover and no credentials.
rules:
  # --- Bronze ---------------------------------------------------------------
  action-setup:
    status: done
    comment: >-
      Site-wide services (replan, release, boost, …) are registered once in
      async_setup, never per entry - the docstring names this rule directly
      (__init__.py, PLAN §7 dec. 8).
  appropriate-polling:
    status: exempt
    comment: >-
      No device is polled. The coordinator runs in push mode: the engine ticks
      on meter updates (debounced ~10 s) and a 30 s heartbeat, and publishes
      with async_set_updated_data (HLD §4, D7 §5.1).
  brands:
    status: done
    comment: >-
      brand/ ships icon, logo and dark_logo at 1× and 2×, which HA 2026.3+
      (the floor) serves itself; the brands repository no longer takes custom
      integrations (D8 §5.12, PLAN §7 dec. 29, WP B.1). HACS's store listing
      still shows a blank icon (hacs/integration#5171).
  common-modules:
    status: done
    comment: >-
      entity.py holds the shared PowerplanEntity/LoadEntity base classes;
      runtime.py owns a real homeassistant.helpers.update_coordinator.
      DataUpdateCoordinator rather than a separate coordinator.py - the
      coordinator's own data is the site's engine state, which runtime.py
      already orchestrates end to end (D7 §4.3, §5.5).
  config-flow:
    status: done
    comment: >-
      config_flow.py plus one subentry flow per kind (load, circuit, group,
      zone) under flow/, each rendering from its own device type's or
      constraint's registry schema (D4/D6, WP2.4…5.3).
  config-flow-test-coverage:
    status: done
    comment: >-
      flow/ measures 90.9 % line coverage (floor 80 %, `tools/coverage_gate.py`,
      WP6.1 checkpoint) - tests/flows/ covers every subentry kind
      plus the site's own onboarding and reconfigure flows.
  dependency-transparency:
    status: done
    comment: >-
      manifest.json's requirements list the integration's only third-party
      dependency (holidays>=0.84, core/pricing/holidays.py); core/ is pure
      Python and stdlib, providers/ use only HA's own helpers.
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: >-
      powerplan provides no condition platform. Automations read the published
      entities and the powerplan_* bus events instead (D8 §5.6).
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: >-
      powerplan provides no trigger platform. Every transition is fired on the
      bus as a powerplan_* event with its reason attached (D8 §5.6).
  entity-event-setup:
    status: done
    comment: >-
      Every coordinator-driven platform relies on CoordinatorEntity's own
      listener wiring; the one entity that also owns a bespoke subscription
      (event.py's SiteEventEntity, the bus mirror) registers and unregisters
      it through async_on_remove in async_added_to_hass.
  entity-unique-id:
    status: done
    comment: >-
      entity.py::unique_id() derives every entity's id from the entry id (and
      the subentry id and load id for a load entity), never from a name
      (INV-50).
  has-entity-name:
    status: done
    comment: PowerplanEntity sets _attr_has_entity_name = True for every entity.
  runtime-data:
    status: done
    comment: >-
      type PowerplanConfigEntry = ConfigEntry[Runtime]; entry.runtime_data is
      set in async_setup_entry and read everywhere else, never hass.data[DOMAIN].
  test-before-configure:
    status: exempt
    comment: >-
      There is nothing to connect to at configure time. Bound entities are
      validated by the flow's schemas (INV-49); a missing or unavailable entity
      degrades explicitly to Quality.UNAVAILABLE with a repair issue (INV-53)
      and never raises ConfigEntryNotReady.
  test-before-setup:
    status: exempt
    comment: Same reason as test-before-configure (INV-53).
  unique-config-entry:
    status: exempt
    comment: >-
      A site is a grid connection, and a household may have more than one.
      Nothing identifies a site but the name the user gives it.

  # --- Silver ---------------------------------------------------------------
  action-exceptions:
    status: done
    comment: >-
      Every service handler raises homeassistant.exceptions.ServiceValidationError
      on bad input (services.py), never a bare ValueError.
  config-entry-unloading:
    status: done
    comment: >-
      async_unload_entry calls Runtime.stop(), which calls
      hass.config_entries.async_unload_platforms(entry, PLATFORMS) and flushes
      the store; async_setup_entry's own async_forward_entry_setups is its pair.
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: done
    comment: >-
      PowerplanEntity.available is false without a snapshot; LoadEntity.available
      also folds in the load's own health (unhealthy AND stale_roles) - never a
      state the coordinator itself does not vouch for.
  integration-owner:
    status: done
    comment: manifest.json's codeowners names @jkaberg.
  log-when-unavailable:
    status: done
    comment: >-
      providers/meters/base.py::_fault logs once per (entity, reason) and never
      again while the same fault holds - the docstring names the rule's own
      shape directly (D3 §8); providers/profiles/base.py's own unit- and
      domain-binding warnings fire once, at bind time (materialised at setup,
      not read per tick).
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 on every platform module (WP6.1) - every entity is
      pushed by the coordinator, none polls or calls a service of its own
      (writes go through the single WriteGate, INV-20/INV-24).
  reauthentication-flow:
    status: exempt
    comment: >-
      No credentials. Every input is an HA entity, a number or a preset; there
      is nothing that can expire.
  test-coverage:
    status: done
    comment: >-
      Overall 94.8 % lines (floor 85 %, `tools/coverage_gate.py`, WP6.1
      checkpoint) - core/ 96.9 %, providers/ 94.2 %, writegate.py
      100 %, flow/ 90.9 %; gated in CI, not just measured.

  # --- Gold -----------------------------------------------------------------
  devices:
    status: done
    comment: >-
      entity.py::load_device_info/site_device_info group every entity under a
      site device or a load device, the load devices linked to the site with
      via_device_id (D8 §5.5).
  diagnostics:
    status: done
    comment: >-
      diagnostics.py: async_get_config_entry_diagnostics and
      async_get_device_diagnostics, redacting persons, the notify target and
      the home's coordinates (D8 §5.10).
  discovery:
    status: exempt
    comment: >-
      There is nothing to discover: a site is a grid connection and a load is a
      device the user already has in Home Assistant. The load flow starts from
      an HA device picker and matches a profile against it (D4 §5.9).
  discovery-update-info:
    status: exempt
    comment: Same reason as discovery - no network discovery exists.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: >-
      Loads, groups, zones and circuits are config subentries the user adds and
      removes; nothing appears at runtime that was not configured.
  entity-category:
    status: done
    comment: >-
      Diagnostic and config entities set entity_category (EntityCategory.
      DIAGNOSTIC/CONFIG) across binary_sensor.py, sensor.py, number.py,
      button.py, select.py and load_entities.py.
  entity-device-class: todo
  entity-disabled-by-default:
    status: done
    comment: >-
      Noisy or rarely used entities set entity_registry_enabled_default = False
      across sensor.py, binary_sensor.py, button.py, number.py and
      load_entities.py.
  entity-translations:
    status: done
    comment: >-
      strings.json's entity block covers every platform; translations/en.json
      and nb.json mirror it (has_entity_name + translation_key on every
      entity, per entity.py).
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow:
    status: done
    comment: >-
      Every subentry flow (load, circuit, group, zone) has a reconfigure step
      that pre-fills from the existing subentry and re-derives on save - D4/D6
      §9, tested per kind (e.g. test_zone_flow.py's own reconfigure case, WP5.3).
      The site's own entry has one too (`PowerplanConfigFlow.
      async_step_reconfigure`, found missing at WP6.1): it restores every
      instance attribute `_assemble()` would have set and re-enters the same
      step chain at `name`, so every step's own form is pre-filled exactly as
      onboarding's is - `tests/flows/test_site_reconfigure.py`.
  repair-issues:
    status: done
    comment: >-
      repairs.py's CATALOGUE, raised/cleared under a per-site issue id,
      evaluated edge-triggered after every tick by RepairsWatch (D8 §5.9, §8).
  stale-devices: todo

  # --- Platinum -------------------------------------------------------------
  async-dependency:
    status: exempt
    comment: >-
      No client library. Prices arrive through other integrations' entities and
      actions, meters through hass.states; the only requirement is holidays,
      which is a pure calendar lookup.
  inject-websession:
    status: exempt
    comment: powerplan opens no HTTP session of its own (see async-dependency).
  strict-typing: todo
