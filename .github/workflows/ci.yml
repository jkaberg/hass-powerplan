name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  # D9 §5.8: ruff → mypy → pytest, over the two fixture lines.
  # PLAN §7 dec. 1: one Python (3.14), HA floor and latest stable.
  quality:
    name: ruff · mypy · pytest (${{ matrix.line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pytest-homeassistant-custom-component 0.13.320 → homeassistant 2026.3.4,
          # the first release line that requires Python 3.14 (the hacs.json floor).
          - line: ha-floor
            phcc: "0.13.320"
          # The newest release: the `dev` group's range resolves to it.
          - line: ha-latest
            phcc: "latest"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync the environment
        run: uv sync

      - name: Move to the HA floor fixture line
        if: matrix.line == 'ha-floor'
        # The sync resolves the latest line; the floor line is installed on top of it.
        # phcc pins homeassistant and its own test dependencies exactly, so this
        # replaces the whole HA stack.
        run: uv pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"

      - name: Report the versions under test
        run: |
          uv run python -c "from homeassistant.const import __version__ as v; print('homeassistant', v)"
          uv run python -c "import sys; print('python', sys.version)"

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy --strict on core/
        run: uv run mypy custom_components/powerplan/core

      - name: pytest
        run: |
          uv run pytest -m "not perf and not backtest and not bench and not e2e" -q \
            -n auto --dist=loadgroup \
            --cov --cov-report=term-missing --cov-report=xml --cov-report=json

      - name: Coverage floors (D9 §2)
        # Per-path floors (core/ 90 % lines / 85 % branches, providers/ 80 %,
        # writegate.py 100 %, flow/ 80 %, overall 85 %) - one gate script since
        # pytest-cov's own --cov-fail-under is a single overall number (WP6.1).
        run: uv run python tools/coverage_gate.py

      - name: Perf budgets (D9 §5.1)
        # tick < 50 ms, planning < 500 ms, both at 20 loads - excluded from the
        # main pytest run above (marker perf) so a slow CI runner never fails
        # correctness; this step's own failure is a timing regression only.
        # Named explicitly: tick_budget.py/plan_budget.py are D9's own module
        # names, not test_*.py, so `pytest tests/perf` alone silently collects
        # nothing.
        run: uv run pytest tests/perf/tick_budget.py tests/perf/plan_budget.py -m perf -q

      - name: INV → tests matrix (D9 §5.6)
        if: matrix.line == 'ha-latest'
        run: |
          {
            echo '### INV → tests'
            echo
            uv run python tools/inv_report.py
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Reference benchmark (D9 §5.9–5.11) --------------------------------
      - name: bench smoke (every PR, ≤ 1 min budget; table posted to the PR)
        if: matrix.line == 'ha-latest'
        run: |
          {
            echo '### Benchmark: nordic_detached × y2026_27, smoke'
            echo
            echo '```'
            uv run python tools/benchmark.py --tier smoke --compare
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: bench month (required before merge for a PR touching core/)
        if: matrix.line == 'ha-latest' && contains(github.event.pull_request.labels.*.name, 'core')
        run: |
          {
            echo '### Benchmark: nordic_detached × y2026_27, month'
            echo
            echo '```'
            uv run python tools/benchmark.py --tier month --compare
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # `bench full` runs nightly on main and on a PR labelled `bench-full`;
      # the `e2e` day runs weekly in `e2e.yml` (D9 §5.10, WP1.7).

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
