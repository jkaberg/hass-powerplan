name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

# D9 §5.8, §5.13 (WP T.1a): the same tests as before, in parallel jobs, and the
# HA-agnostic ones once. Nothing is skipped: every test that ran in the single
# job still runs in exactly one of the jobs below (the HA-facing ones on both
# fixture lines). The slowest job - the scenarios, or the month tier on a core
# PR - sets the wall clock, not the sum.
#
#   lint ─┐
#   hygiene (vulture · jscpd), frontend (… · knip)
#   ha (floor, latest) ─┐
#   core ───────────────┼─► coverage
#   scenarios ──────────┘
#   bench (smoke; month on a `core` PR)
#   digests (a `speed` PR only: every result against the base)
jobs:
  lint:
    name: ruff · mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy --strict on core/
        run: uv run mypy custom_components/powerplan/core

  # D12 §9 7 (WP6.4b): the committed bundle is what HACS installs, so CI
  # rebuilds it from `frontend/` and fails when it differs; vitest covers the
  # timeline's slot transform and the gauge's colours.
  frontend:
    name: frontend · bundle · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # D9 §5.8 (D-0662): no unused file, export or dependency (`frontend/knip.json`).
      - run: npm run knip
      - name: The committed bundle is the build of these sources
        run: |
          npm run build
          git status --porcelain -- ../custom_components/powerplan/frontend/dist
          test -z "$(git status --porcelain -- ../custom_components/powerplan/frontend/dist)"

  # D9 §5.8 (D-0662): no dead code, and no more duplication than the ceiling.
  # vulture reads `[tool.vulture]` and `tools/vulture_whitelist.py`; jscpd reads
  # `.jscpd.json`, whose `threshold` is the ceiling in percent of lines.
  hygiene:
    name: vulture · jscpd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: vulture - no dead code
        run: uv run vulture
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: jscpd - duplication under the ceiling
        run: npx --yes jscpd@3.5.10

  # PLAN §7 dec. 1: one Python (3.14), HA floor and latest stable. Only the
  # suites that load Home Assistant can differ between the two lines.
  ha:
    name: HA-facing tests (${{ matrix.line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pytest-homeassistant-custom-component 0.13.320 → homeassistant 2026.3.4,
          # the first release line that requires Python 3.14 (the hacs.json floor).
          - line: ha-floor
            phcc: "0.13.320"
          # 0.13.366 → homeassistant 2026.9.3, the latest stable; this is the pin
          # in the `dev` dependency group and therefore in uv.lock.
          - line: ha-latest
            phcc: "0.13.366"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Move to the HA floor fixture line
        if: matrix.line == 'ha-floor'
        # uv.lock pins the latest line; the floor line is installed on top of it.
        # phcc pins homeassistant and its own test dependencies exactly, so this
        # replaces the whole HA stack.
        run: uv pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      - name: Report the versions under test
        run: |
          uv run python -c "from homeassistant.const import __version__ as v; print('homeassistant', v)"
          uv run python -c "import sys; print('python', sys.version)"
      - name: pytest (flows, surface, runtime, providers)
        run: |
          uv run pytest tests/flows tests/surface tests/runtime tests/providers \
            -m "not perf and not backtest and not bench and not e2e" -q \
            -n auto --dist=loadgroup --cov --cov-report=
      - name: Name the coverage data for the combine
        if: matrix.line == 'ha-latest'
        run: mv .coverage .coverage.ha
      - name: Keep the coverage data
        if: matrix.line == 'ha-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ha
          path: .coverage.ha
          include-hidden-files: true

  core:
    name: core, property, sim, backtest, benchmark (fast half)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: pytest
        run: |
          uv run pytest tests/core tests/property tests/sim tests/backtest tests/benchmark \
            -m "not perf and not backtest and not bench and not e2e" -q \
            -n auto --dist=loadgroup --cov --cov-report=
      - name: Name the coverage data for the combine
        run: mv .coverage .coverage.core
      - name: Keep the coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: .coverage.core
          include-hidden-files: true
      - name: Perf budgets (D9 §5.1)
        # tick < 50 ms, planning < 500 ms, both at 20 loads. Named explicitly:
        # tick_budget.py/plan_budget.py are D9's own module names, not test_*.py,
        # so `pytest tests/perf` alone silently collects nothing.
        run: uv run pytest tests/perf/tick_budget.py tests/perf/plan_budget.py -m perf -q
      - name: INV → tests matrix (D9 §5.6)
        run: |
          {
            echo '### INV → tests'
            echo
            uv run python tools/inv_report.py
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preset versions to re-read (D9 §3, PLAN R12)
        # Warns, never fails: a table verified more than six months ago is a
        # reason to read the operator's sheet again (D2 §2, PLAN §7 dec. 21).
        run: |
          {
            echo '### Rules, presets and tax rates verified more than six months ago'
            echo
            uv run python tools/preset_age.py
          } >> "$GITHUB_STEP_SUMMARY"

  scenarios:
    name: scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Restore the simulation cache (D9 §5.13)
        # The cache is content-addressed inside (tests/scenarios/cache.py): an
        # entry from an older commit is simply never hit, so restoring the
        # nearest one is always safe.
        uses: actions/cache@v6
        with:
          path: .cache/powerplan-sims
          key: sims-${{ hashFiles('custom_components/powerplan/core/**', 'tests/**/*.py', 'uv.lock', 'pyproject.toml') }}
          restore-keys: sims-
      - name: pytest tests/scenarios
        run: |
          uv run pytest tests/scenarios \
            -m "not perf and not backtest and not bench and not e2e" -q \
            -n auto --dist=loadgroup

  coverage:
    name: coverage floors
    needs: [ha, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Coverage floors (D9 §2)
        # Per-path floors (core/ 90 % lines / 85 % branches, providers/ 80 %,
        # writegate.py 100 %, flow/ 80 %, overall 85 %). The scenarios are not
        # counted: a cached scenario executes nothing, so its lines would
        # appear and vanish with the cache (D9 §5.13).
        run: |
          uv run coverage combine
          uv run coverage json -o coverage.json
          uv run python tools/coverage_gate.py

  # --- Reference benchmark (D9 §5.9–5.11) ------------------------------------
  bench:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: bench smoke (every PR; table posted to the PR)
        # The tier's two spans run in parallel processes (T.1a); the result is
        # byte-identical to running them in turn.
        run: |
          {
            echo '### Benchmark: nordic_detached × y2026_27, smoke'
            echo
            echo '```'
            uv run python tools/benchmark.py --tier smoke --compare
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: bench month (required before merge for a PR touching core/)
        if: contains(github.event.pull_request.labels.*.name, 'core')
        run: |
          {
            echo '### Benchmark: nordic_detached × y2026_27, month'
            echo
            echo '```'
            uv run python tools/benchmark.py --tier month --compare
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # `bench full` runs on workflow_dispatch; the uncached suite and the
      # determinism test run nightly in `nightly.yml`; the `e2e` day weekly in
      # `e2e.yml` (D9 §5.10, WP1.7).

  # D9 §9 13 (WP T.1b): a PR labelled `speed` claims to change how long things
  # take and nothing else. Every scenario result and the smoke benchmark are
  # computed on the PR and on its base, and one moved digest fails the PR,
  # whatever it gains. Unlabelled PRs are not compared: a behaviour change is
  # judged by the tests and the benchmark tolerances, not by byte identity.
  digests:
    name: speed PR - results byte-identical to the base
    if: contains(github.event.pull_request.labels.*.name, 'speed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Restore the base's simulations (D9 §5.13)
        uses: actions/cache@v6
        with:
          path: .cache/digests/${{ github.event.pull_request.base.sha }}/.cache
          key: digests-${{ github.event.pull_request.base.sha }}
      - name: tools/digests.py against the base
        run: uv run python tools/digests.py --against ${{ github.event.pull_request.base.sha }}

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
