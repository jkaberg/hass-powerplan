# The canonical label set, synced to GitHub by workflows/labels.yml. `core` and
# `speed` switch CI jobs on (ci.yml: the month benchmark, the digests check).
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: question
  color: d876e3
  description: Further information is requested
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: invalid
  color: e4e669
  description: This doesn't seem right
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency file
- name: needs-info
  color: fbca04
  description: Waiting on the reporter for logs or details
- name: confirmed
  color: 0e8a16
  description: Reproduced or verified
- name: blocked
  color: b60205
  description: Waiting on upstream or another issue
- name: breaking-change
  color: e11d21
  description: Changes public API, config or entity names
- name: core
  color: 5319e7
  description: Touches core/; CI runs the month benchmark
- name: speed
  color: c5def5
  description: Claims only a speed change; CI checks every result is byte-identical to the base
